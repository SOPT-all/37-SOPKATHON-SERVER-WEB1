#              echo "No container named ${{ env.CURRENT_UPSTREAM }} found. Skipping stop & remove."
#            fi

      - name: 기존 도커 이미지 제거
        uses: appleboy/ssh-action@v1.0.3
        with:
          username: ubuntu
          host: ${{ secrets.SERVER_IP }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script_stop: true
          script: |
            sudo docker image prune -f