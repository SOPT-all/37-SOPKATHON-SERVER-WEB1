name: develop-cd.yml
on:
  pull_request:
    types: [synchronize, closed, opened]
    branches: [develop]
    paths:
      - 'src/**'
      - 'build.gradle'

jobs:
  image-build:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: checkout the code
        uses: actions/checkout@v4

      - name: Remove application-local.yml
        run: |
          rm -f src/main/resources/application-local.yml

      - name: Add application-blue.yml
        run: |
          mkdir -p ./src/main/resources
          echo "${{ secrets.APPLICATION_BLUE }}" > ./src/main/resources/application-blue.yml

      - name: Add application-green.yml
        run: |
          mkdir -p ./src/main/resources
          echo "${{ secrets.APPLICATION_GREEN }}" > ./src/main/resources/application-green.yml

      - name: Add application.yml
        run: |
          mkdir -p ./src/main/resources
          echo "${{ secrets.APPLICATION_DEFAULT }}" > ./src/main/resources/application.yml

      - name: Add application-dev.yml
        run: |
          mkdir -p ./src/main/resources
          echo "${{ secrets.APPLICATION_DEV }}" > ./src/main/resources/application-dev.yml

      - name: Jib로 이미지 빌드 및 Docker Hub 업로드
        run: |
          ./gradlew jib \
            -PjibToImage=${{ secrets.DOCKER_IMAGE_NAME }} \
            -PjibTag=runid-${{ github.run_id }} \
            -PdockerHubUsername=${{ secrets.DOCKER_USERNAME }} \
            -PdockerHubPassword=${{ secrets.DOCKER_TOKEN }}

  deploy:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    needs: [ image-build ]
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Set target IP
        run: |
          STATUS=$(curl -k --connect-timeout 10 --max-time 30 -o /dev/null -w "%{http_code}" "https://${{ secrets.DOMAIN }}/actuator/health" || echo "000")
          echo "Health Status: $STATUS"
          if [ $STATUS = 200 ]; then
            CURRENT_UPSTREAM=$(curl -s -k https://${{ secrets.DOMAIN }}/api/v1/env | jq -r '.env')            
            
            if [ -z "$CURRENT_UPSTREAM" ] || [ "$CURRENT_UPSTREAM" = "null" ]; then
              echo "Actuator returned null. Defaulting to GREEN."
              CURRENT_UPSTREAM=green
            fi
          else
            CURRENT_UPSTREAM=green
          fi
          echo "🚀 Current Upstream: $CURRENT_UPSTREAM"
          echo CURRENT_UPSTREAM=$CURRENT_UPSTREAM >> $GITHUB_ENV
          echo $CURRENT_UPSTREAM
          if [ $CURRENT_UPSTREAM = blue ]; then
            echo "CURRENT_PORT=8080" >> $GITHUB_ENV
            echo "STOPPED_PORT=8081" >> $GITHUB_ENV
            echo "TARGET_UPSTREAM=green" >> $GITHUB_ENV
          elif [ $CURRENT_UPSTREAM = green ]; then
            echo "CURRENT_PORT=8081" >> $GITHUB_ENV
            echo "STOPPED_PORT=8080" >> $GITHUB_ENV
            echo "TARGET_UPSTREAM=blue" >> $GITHUB_ENV
          else
            echo "error"
            exit 1
          fi

      - name: Docker 로그인
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Docker compose
        uses: appleboy/ssh-action@v1.0.3
        env:
          TARGET_UPSTREAM: ${{ env.TARGET_UPSTREAM }}
        with:
          username: ubuntu
          host: ${{ secrets.SERVER_IP }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script_stop: true
          script: |
            echo ${{ secrets.DOCKER_TOKEN }} | sudo docker login -u ${{ secrets.DOCKER_USERNAME }} --password-stdin
            sudo docker pull ${{ secrets.DOCKER_IMAGE_NAME }}:latest
            sudo docker compose -f docker-compose-${{ env.TARGET_UPSTREAM }}.yml up -d

      - name: 새로운 서버 헬스체킹 (재시도 15회, 5초 간격)
        uses: appleboy/ssh-action@v1.0.3
        with:
          username: ubuntu
          host: ${{ secrets.SERVER_IP }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            STOPPED_PORT="${{ env.STOPPED_PORT }}"
            echo "📌 STOPPED_PORT is $STOPPED_PORT"
            for i in {1..15}
            do
              STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:$STOPPED_PORT/actuator/health)
              echo "[$i] $STOPPED_PORT Health check response code: $STATUS"
              if [ "$STATUS" = "200" ]; then
                echo "서버 확인"
                exit 0
              fi
              sleep 5
            done
            echo "서버 헬스체크 실패"
            exit 1

      - name: nginx upstream 변경
        uses: appleboy/ssh-action@master
        with:
          username: ubuntu
          host: ${{ secrets.SERVER_IP }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            echo "set \$service_url ${{ env.TARGET_UPSTREAM }};" | sudo docker exec -i nginx tee /etc/nginx/conf.d/service-env.inc
            sudo docker exec nginx nginx -s reload

